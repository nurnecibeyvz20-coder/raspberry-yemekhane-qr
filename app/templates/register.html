{% extends "base.html" %}
{% block title %}Kayıt Ol — Karatay Belediyesi Yemekhane{% endblock %}
{% block content %}
<div class="sayfa-orta">
  <div class="kart" style="width: 100%; max-width: 380px; text-align: center;">
    <h1 class="baslik" style="font-size: 20px;">Personel Başvurusu</h1>
    <p class="soluk">Başvurunuz yönetici onayından sonra aktif olur.</p>
    {% if error %}<div class="bant-hata">{{ error }}</div>{% endif %}
    <form method="post" action="/kayit" style="text-align: left;">
      <label class="alan-etiket" for="sicil_no">Sicil No</label>
      <input class="alan" type="text" id="sicil_no" name="sicil_no" required autofocus>
      <label class="alan-etiket" for="ad_soyad">Ad Soyad</label>
      <input class="alan" type="text" id="ad_soyad" name="ad_soyad" required>
      <label class="alan-etiket" for="password">Şifre</label>
      <input class="alan" type="password" id="password" name="password" minlength="8" required>
      <button class="btn btn-blok ust-bosluk" type="submit">Başvuru Yap</button>
    </form>
    <p class="ust-bosluk"><a href="/login" class="soluk">Girişe dön</a></p>
  </div>
</div>
{% endblock %}
