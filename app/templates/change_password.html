{% extends "base.html" %}
{% block title %}Şifre Değiştir — Yemekhane QR{% endblock %}
{% block content %}
<main class="change-password">
    <h1>Şifre Değiştir</h1>
    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}
    <form method="post" action="/change-password">
        <label for="old_password">Eski Şifre</label>
        <input type="password" id="old_password" name="old_password" required autofocus>
        <label for="new_password">Yeni Şifre</label>
        <input type="password" id="new_password" name="new_password" required minlength="8">
        <button type="submit">Kaydet</button>
    </form>
    <p><a href="/qr">QR sayfasına dön</a></p>
</main>
{% endblock %}
