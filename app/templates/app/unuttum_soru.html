{% extends "base.html" %}
{% block title %}Gizli Soru — Karatay Belediyesi Yemekhane{% endblock %}
{% block content %}
<div class="sayfa-orta">
  <div class="kart" style="width: 100%; max-width: 380px; text-align: center;">
    <img src="/static/logo.jpg" alt="Karatay Belediyesi" style="height: 64px; margin-bottom: 8px;">
    <h1 class="baslik" style="font-size: 20px;">Gizli Soru</h1>
    {% if error %}<div class="bant-hata">{{ error }}</div>{% endif %}
    <form method="post" action="/sifremi-unuttum/soru" style="text-align: left;">
      <label class="alan-etiket" for="cevap">Gizli sorunuzun cevabı</label>
      <input class="alan" type="text" id="cevap" name="cevap" required autofocus autocomplete="off">
      <button class="btn btn-blok ust-bosluk" type="submit">Doğrula</button>
    </form>
    <p class="ust-bosluk"><a href="/login" class="soluk" style="font-size: 14px;">Girişe dön</a></p>
  </div>
</div>
{% endblock %}
