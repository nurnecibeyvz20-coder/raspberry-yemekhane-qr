{% extends "base.html" %}
{% block title %}Şifremi Unuttum — Karatay Belediyesi Yemekhane{% endblock %}
{% block content %}
<div class="sayfa-orta">
  <div class="kart" style="width: 100%; max-width: 380px; text-align: center;">
    <img src="/static/logo.jpg" alt="Karatay Belediyesi" style="height: 64px; margin-bottom: 8px;">
    <h1 class="baslik" style="font-size: 20px;">Şifremi Unuttum</h1>
    <p class="soluk" style="margin-top: -8px;">Sicil numaranızı girin</p>
    {% if error %}<div class="bant-hata">{{ error }}</div>{% endif %}
    <form method="post" action="/sifremi-unuttum" style="text-align: left;">
      <label class="alan-etiket" for="sicil_no">Sicil No</label>
      <input class="alan" type="text" id="sicil_no" name="sicil_no" required autofocus>
      <button class="btn btn-blok ust-bosluk" type="submit">Devam</button>
    </form>
    <p class="ust-bosluk"><a href="/login" class="soluk" style="font-size: 14px;">Girişe dön</a></p>
  </div>
</div>
{% endblock %}
