{% extends "base.html" %}
{% block title %}Yeni Personel{% endblock %}
{% block topbar %}
{% set aktif_sayfa = 'personel' %}
{% include "admin/_nav.html" %}
{% endblock %}
{% block content %}
<div class="icerik" style="max-width: 480px;">
  <div class="kart">
    <h1 class="baslik">Yeni Personel</h1>
    {% if error %}<div class="bant-hata">{{ error }}</div>{% endif %}
    <form method="post" action="/admin/users/new">
      <label class="alan-etiket" for="sicil_no">Sicil No</label>
      <input class="alan" id="sicil_no" type="text" name="sicil_no" value="{{ form.sicil_no or '' }}" required>
      <label class="alan-etiket ust-bosluk" for="ad_soyad">Ad Soyad</label>
      <input class="alan" id="ad_soyad" type="text" name="ad_soyad" value="{{ form.ad_soyad or '' }}" required>
      <label class="alan-etiket ust-bosluk" for="password">Şifre</label>
      <input class="alan" id="password" type="password" name="password" required>
      <label class="alan-etiket ust-bosluk" for="role">Rol</label>
      <select class="alan" id="role" name="role">
        <option value="personel" {{ "selected" if form.role != "admin" else "" }}>Personel</option>
        <option value="admin" {{ "selected" if form.role == "admin" else "" }}>Admin</option>
      </select>
      <button class="btn btn-blok ust-bosluk" type="submit">Kaydet</button>
    </form>
  </div>
</div>
{% endblock %}
