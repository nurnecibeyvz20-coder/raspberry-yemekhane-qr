{% extends "base.html" %}
{% block title %}Yönetici Girişi — Karatay Belediyesi{% endblock %}
{% block content %}
<div class="sayfa-orta auth-sahne">
  <div class="kart auth-kart" style="width: 100%; max-width: 380px; text-align: center;">
    <h1 class="baslik" style="font-size: 20px;">Yönetici Girişi</h1>
    {% if error %}<div class="bant-hata">{{ error }}</div>{% endif %}
    <form method="post" action="/admin/login" style="text-align: left;">
      <label class="alan-etiket" for="sicil_no">Sicil No</label>
      <input class="alan" type="text" id="sicil_no" name="sicil_no" required autofocus>
      <label class="alan-etiket" for="password">Şifre</label>
      <input class="alan" type="password" id="password" name="password" required>
      <button class="btn btn-blok ust-bosluk" type="submit">Yönetici Girişi</button>
    </form>
    <p class="ust-bosluk"><a href="/login" class="soluk">Personel girişine dön</a></p>
  </div>
</div>
{% endblock %}
