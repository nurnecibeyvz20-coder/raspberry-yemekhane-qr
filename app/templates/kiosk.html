{% extends "base.html" %}
{% block title %}Yemekhane Kiosk{% endblock %}
{% block content %}
<style>
  body { overflow: hidden; cursor: none; }
  .screen { position: fixed; inset: 0; display: flex;
    flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px; color: var(--k-beyaz);
    transition: opacity .25s ease; opacity: 0; pointer-events: none; }
  .screen.active { opacity: 1; pointer-events: auto; }
  #idle { z-index: 1; }
  #result, #connecting { z-index: 2; }
  #idle { background: linear-gradient(180deg, var(--k-birincil), var(--k-birincil-koyu)); }
  #idle .logo-yuvarlak { animation: nefes 4s ease-in-out infinite; }
  @keyframes nefes { 0%, 100% { transform: scale(1); }
    50% { transform: scale(1.04); } }
  #result.active #result-icon { animation: ikon-pop .35s ease-out; }
  @keyframes ikon-pop { from { transform: scale(.4); opacity: 0; }
    60% { transform: scale(1.15); } to { transform: scale(1); opacity: 1; } }
  #result.active::after { content: ""; position: absolute; bottom: 0; left: 0;
    height: 4px; background: var(--k-beyaz); opacity: .8;
    animation: sayac 5s linear forwards; }
  @keyframes sayac { from { width: 0; } to { width: 100%; } }
  #idle .logo-yuvarlak {
    width: 200px; height: 200px; border-radius: 50%;
    background: var(--k-beyaz); display: flex; align-items: center;
    justify-content: center; box-shadow: var(--k-golge-buyuk); }
  #idle .logo-yuvarlak img { width: 160px; height: auto; }
  #idle h1 { font-size: 34px; font-weight: 600; margin: 24px 0 0; }
  #clock { font-size: 72px; font-weight: 200; margin: 8px 0; font-variant-numeric: tabular-nums; }
  #idle .yonerge { font-size: 26px; opacity: .9; }
  #result.green  { background: var(--k-basari); }
  #result.yellow { background: var(--k-uyari); }
  #result.red    { background: var(--k-hata); }
  #result-icon { font-size: 110px; line-height: 1; }
  #result-name { font-size: 40px; font-weight: 700; margin: 12px 0 0; }
  #result-message { font-size: 30px; margin: 8px 0; }
  #result-balance { font-size: 26px; opacity: .95; }
  #connecting { background: var(--k-metin); font-size: 30px; }
  #scan-input { position: absolute; top: -100px; left: -100px; opacity: 0; }
</style>
<div id="idle" class="screen active">
  <div class="logo-yuvarlak"><img src="/static/logo.jpg" alt="Karatay Belediyesi"></div>
  <h1>Karatay Belediyesi — Yemekhane</h1>
  <div class="saat" id="clock">--:--:--</div>
  <div class="yonerge">QR kodunuzu okutun</div>
</div>
<div id="result" class="screen">
  <div id="result-icon"></div>
  <div id="result-name"></div>
  <div id="result-message"></div>
  <div id="result-balance"></div>
</div>
<div id="connecting" class="screen">Sistem bağlanıyor...</div>
<input type="text" id="scan-input" autocomplete="off" autofocus>
<script>
const input = document.getElementById("scan-input");
const idle = document.getElementById("idle");
const result = document.getElementById("result");
const connecting = document.getElementById("connecting");
let resetTimer = null;

// Sesli anons: sunucu imzalı metni /api/tts ile seslendirir. Chromium
// autoplay politikası için kiosk --autoplay-policy=no-user-gesture-required
// ile başlatılır.
let aktifAnons = null;
function anonsCal(anons) {
    if (!anons || !anons.text) return;
    try {
        if (aktifAnons) { aktifAnons.pause(); }
        aktifAnons = new Audio("/api/tts?text=" +
            encodeURIComponent(anons.text) + "&sig=" +
            encodeURIComponent(anons.sig));
        aktifAnons.play().catch(() => {});
    } catch (e) { /* ses akisi bozmasin */ }
}

function show(el) {
    for (const s of [idle, result, connecting]) s.classList.remove("active");
    el.classList.add("active");
}

function backToIdle() {
    show(idle);
    input.value = "";
    input.focus();
}

// Saat
function tick() {
    const now = new Date();
    document.getElementById("clock").textContent =
        now.toLocaleTimeString("tr-TR");
}
tick();
setInterval(tick, 1000);

// Gizli input her zaman odakta kalsın
document.addEventListener("click", () => input.focus());
input.addEventListener("blur", () => setTimeout(() => input.focus(), 0));
input.focus();

// HID okuyucu ABD düzenine göre tuş kodu gönderir; işletim sistemi
// klavye düzeni (örn. Türkçe) karakterleri bozabilir (i -> î gibi).
// Bu yüzden yazılan karaktere (e.key) değil FİZİKSEL tuşa (e.code)
// bakarak token'ı kendimiz kurarız — düzenden bağımsız çalışır.
let buffer = "";

function charFromCode(e) {
    const c = e.code;
    // Harfler/rakamlar: fiziksel tuş konumu (düzenden bağımsız).
    // Kanıt: OS Türkçe düzeni 'i' harfini bozuyordu (î), e.code çözer.
    if (c.length === 4 && c.startsWith("Key"))
        return e.shiftKey ? c[3] : c[3].toLowerCase();
    if (c.length === 6 && c.startsWith("Digit") && !e.shiftKey)
        return c[5];
    if (c.length === 7 && c.startsWith("Numpad") && c[6] >= "0" && c[6] <= "9")
        return c[6];
    // Noktalama (. - _): fiziksel konum okuyucunun dil ayarına göre
    // değişir (TR düzende '.' Slash tuşundadır). OS'in ürettiği karaktere
    // güven — kanıt: e.key yakalamasında noktalama hep doğru çıkıyordu.
    if (e.key === "." || e.key === "-" || e.key === "_") return e.key;
    return null;  // token alfabesi dışı tuşlar yok sayılır
}

async function submitToken(token) {
    if (!token) return;
    try {
        const r = await fetch("/api/checkin", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({token})
        });
        showResult(await r.json());
    } catch {
        showConnecting();
    }
}

document.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
        e.preventDefault();
        const token = buffer;
        buffer = "";
        input.value = "";
        submitToken(token);
        return;
    }
    const ch = charFromCode(e);
    if (ch !== null) {
        buffer += ch;
        e.preventDefault();  // düzenin bozduğu karakter input'a yazılmasın
    }
});

function showResult(d) {
    const color = d.status === "onay" ? "green"
                : d.status === "mukerrer" ? "yellow" : "red";
    result.className = "screen active " + color;
    idle.classList.remove("active");
    connecting.classList.remove("active");
    document.getElementById("result-icon").textContent =
        d.ok ? "✔" : (d.status === "mukerrer" ? "⚠" : "✖");
    document.getElementById("result-message").textContent = d.message || "";
    document.getElementById("result-name").textContent = d.ad_soyad || "";
    document.getElementById("result-balance").textContent =
        d.balance != null ? "Kalan: " + d.balance + " TL" : "";
    anonsCal(d.anons);
    clearTimeout(resetTimer);
    resetTimer = setTimeout(backToIdle, 5000);
}

function showConnecting() {
    show(connecting);
    clearTimeout(resetTimer);
    resetTimer = setTimeout(backToIdle, 3000);
}
</script>
{% endblock %}
